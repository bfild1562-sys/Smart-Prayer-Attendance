name: Verify Smart Prayer 4.1 release
on:
  push:
    branches: [verify-release-4-1]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run central server tests with temporary databases
        run: |
          python -m pip install -r cloud-server/requirements.txt
          cd cloud-server && python -m unittest discover -s tests -v
      - name: Check production health and authentication routes
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          base = 'https://smart-prayer-attendance-production.up.railway.app'
          for path, data, status in [('/health', None, 200), ('/api/v1/me', None, 401), ('/api/v1/login', b'{}', 400), ('/api/v1/device/config', None, 401)]:
              req = urllib.request.Request(base+path, data=data, headers={'Content-Type':'application/json'})
              try: response = urllib.request.urlopen(req,timeout=15)
              except urllib.error.HTTPError as error: response = error
              with response:
                  assert response.status == status, (path,response.status)
                  result = json.load(response)
                  assert result['ok'] == (status == 200)
                  if path == '/health': assert result['data']['service'] == 'Smart Prayer Central'
              print(req.get_method(),path,status)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: SmartPrayer-Android-APK
          run-id: 45802233641
          github-token: ${{ github.token }}
          path: built-apk
      - name: Verify package and identify signing certificate
        run: |
          APK=$(find built-apk -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
