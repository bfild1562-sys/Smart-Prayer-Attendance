services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SPA_DATABASE: /data/central.sqlite3
      SPA_PUBLIC_URL: https://${SPA_DOMAIN}
      SPA_GOOGLE_CLIENT_ID: ${SPA_GOOGLE_CLIENT_ID:-}
      SPA_GOOGLE_CLIENT_SECRET: ${SPA_GOOGLE_CLIENT_SECRET:-}
      SPA_TOKEN_KEY: ${SPA_TOKEN_KEY:-}
    volumes:
      - central_data:/data
    expose:
      - '8080'
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${SPA_DOMAIN:?Set SPA_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  central_data:
  caddy_data:
  caddy_config:
